[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "apollo-playlists"
version = "0.2.0"
description = "Music library playlists, ratings, CLI and web interface"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "Flask>=3.1,<4", "typer>=0.16,<1", "rich>=13,<15",
  "elasticsearch>=8.17,<9", "mutagen>=1.47,<2", "PyMySQL>=1.1,<2",
  "PyYAML>=6,<7", "platformdirs>=4,<5", "openai>=1.59,<3",
  "requests>=2.32,<3", "waitress>=3,<4", "python-dotenv>=1,<2",
  "paho-mqtt>=2.1,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12", "build>=1"]

[project.scripts]
apollo = "apollo.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/apollo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
