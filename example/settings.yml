MUSIC_FOLDER: "/path/to/music"

NAVIDROME_URL: "http://localhost:4533"
NAVIDROME_UN: "your-navidrome-username"
NAVIDROME_PWD: "your-navidrome-password"

PLAYLIST_SOURCE_FOLDER: "/mnt/fast/apollo/playlists"
# Optional existing working directory; defaults to PLAYLIST_SOURCE_FOLDER/.apollo.
# Set this when moving sources without moving generated M3Us and the scan cache.
# PLAYLIST_WORK_FOLDER: "/path/to/working/files"
PLAYLIST_PUBLISHED_FOLDER: "/path/to/mpd/playlists"
DYNAMIC_PLAYLIST_FILE: "dynamic"
DEFAULT_PLAYLIST_FILE: "random"

# Direct MPD connection used by per-song Play links.
MPD_HOST: "mpd-server"
MPD_PORT: 6600

# Used to tell Node-RED to load and play dynamic.m3u.
MQTT_SERVER: "mqtt-server"
MQTT_PORT: 1883
MQTT_UN: "mqtt-username"
MQTT_PWD: "mqtt-password"

AI_PROVIDER: "openai"

# Used when AI_PROVIDER is "codex".
CODEX_BIN: "codex"
# CODEX_HOME: "/path/to/authenticated/codex-home"
# CODEX_WORKDIR: "/path/to/apollo"
CODEX_REASONING_EFFORT: "none"
CODEX_TIMEOUT_SECONDS: 120

OPENAI_API_KEY: "your-key"
OPENAI_BASE_URL: "https://openrouter.ai/api/v1"
OPENAI_MODEL: "your-favorite-model"

DATABASE_UN: "dbuser"
DATABASE_PWD: "dbpass"
DATABASE_HOST: "dburl"
DATABASE_NAME: "dbname"

ES_URL: "http://ip_of_elasticsearch:9200"
ES_INDEX: "apollo"

SKIP_STRENGTH: 1
VOTE_STRENGTH: 5
RATING_THRESHOLD: 45

SUPPORTED_EXTENSIONS: [".mp3", ".flac", ".ogg", ".m4a", ".mp4"]

BITRATE_MULTIPLIERS:
  ".mp3": 1.0
  ".ogg": 1.3
  ".m4a": 1.2
  ".aac": 1.2
  ".mp4": 1.2
  ".flac": 1.0

# Local job queue and browser session secret (defaults to ~/.local/state/apollo).
# Use a local filesystem and a different STATE_DIR for each configuration.
# STATE_DIR: "/home/your-user/.local/state/apollo"

# Optional shared browser/API access token. APOLLO_API_TOKEN overrides this.
# Configure before serving beyond localhost; use an HTTPS reverse proxy.
# API_TOKEN: "generate-a-long-random-token"
